<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.45" stop-color="#081428"/>
      <stop offset="1" stop-color="#061b18"/>
    </linearGradient>
    <linearGradient id="name" x1="160" y1="135" x2="1030" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46f2ff"/>
      <stop offset="0.44" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00f5a0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.86 0 0 0 0 1 0 0 0 0.8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
    <style>
      @keyframes floatName {
        0%, 100% { transform: translate3d(0, 0, 0) rotateX(0deg); }
        50% { transform: translate3d(18px, -10px, 0) rotateX(8deg); }
      }
      @keyframes pulseLine {
        0%, 100% { opacity: .28; transform: translateX(-16px); }
        50% { opacity: .9; transform: translateX(16px); }
      }
      @keyframes scan {
        0% { transform: translateY(-120px); opacity: 0; }
        20%, 70% { opacity: .55; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      .name {
        animation: floatName 4.4s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
      .pulse {
        animation: pulseLine 3s ease-in-out infinite;
        transform-origin: center;
      }
      .scan {
        animation: scan 5.5s linear infinite;
      }
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path class="scan" d="M80 0H1120V52H80V0Z" fill="url(#name)" opacity="0.22"/>
  <g opacity="0.95">
    <path d="M116 90H263" stroke="#46f2ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <path d="M937 268H1084" stroke="#00f5a0" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <path class="pulse" d="M105 286H386" stroke="#7c5cff" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <path class="pulse" d="M814 76H1095" stroke="#46f2ff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>
  <g filter="url(#glow)" class="name">
    <text x="600" y="192" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="82" font-weight="900" fill="url(#name)" letter-spacing="0">0xDragonHash</text>
    <text x="600" y="230" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600" fill="#d8fff8" opacity="0.88" letter-spacing="0">BASE BUILDER · ROBINHOOD CRYPTO RESEARCH · TERMINAL AUTOMATION</text>
  </g>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="16" fill="#b7fff1" opacity="0.78">
    <text x="92" y="320">&gt; tracking wallets</text>
    <text x="889" y="48">block: live</text>
    <text x="924" y="320">gas: monitoring</text>
  </g>
</svg>
